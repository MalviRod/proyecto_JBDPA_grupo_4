<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Riesgo de inundación · Uruguay{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--fondo:#f2f6f7;--tinta:#14262e;--agua:#0b5d7a;--borde:#c5d3d9;--blanco:#fff}
*{box-sizing:border-box}
body{margin:0;font:1rem/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;background:var(--fondo);color:var(--tinta)}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1.25rem;background:var(--agua);color:#fff}
header a{color:#fff}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,li:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.aviso{margin:1rem auto;max-width:28rem;padding:.75rem 1rem;background:#fff4d6;border:1px solid #e0c36a;border-radius:6px}
button,select,input{font:inherit;padding:.55rem .7rem;border:1px solid var(--borde);border-radius:6px;background:var(--blanco)}
button{background:var(--agua);color:#fff;border-color:var(--agua);cursor:pointer}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <strong>Riesgo de inundación · Uruguay</strong>
  {% if session.uid %}<span>{{ session.nombre }} · <a href="{{ url_for('logout') }}">Cerrar sesión</a></span>{% endif %}
</header>
{% for m in get_flashed_messages() %}<p class="aviso" role="status">{{ m }}</p>{% endfor %}
{% block contenido %}{% endblock %}
</body>
</html>
